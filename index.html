  <style>
    :root {
      --ink: #3c2830;
      --muted: #83727a;
      --primary: #b85b72;
      --primary-dark: #963d57;
      --rose: #f9edf0;
      --pink: #f6e2e6;
      --peach: #fff2e7;
      --cream: #fffaf6;
      --paper: #ffffff;
      --border: #eedee0;
      --gold: #aa7b46;
      --sage: #eaf0e5;
      --green: #487857;
      --shadow: 0 14px 40px rgba(73, 44, 46, .07);
      --round: 20px
    }

    * {
      box-sizing: border-box
    }

    html {
      scroll-behavior: smooth
    }

    body {
      margin: 0;
      background: var(--cream);
      color: var(--ink);
      font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 15px;
      line-height: 1.55
    }

    button,
    input,
    select,
    textarea {
      font: inherit
    }

    button {
      cursor: pointer
    }

    button:disabled {
      opacity: .55;
      cursor: not-allowed
    }

    img {
      display: block;
      max-width: 100%
    }

    a {
      color: var(--primary)
    }

    h1,
    h2,
    h3,
    p {
      margin-top: 0
    }

    h1,
    h2,
    .serif {
      font-family: Georgia, "Times New Roman", serif;
      font-weight: 500;
      letter-spacing: -.038em
    }

    h1 {
      font-size: clamp(2.6rem, 5vw, 5.1rem);
      line-height: 1.09
    }

    h2 {
      font-size: clamp(2rem, 3.2vw, 3.4rem);
      line-height: 1.12
    }

    h3 {
      font-size: 1.13rem;
      letter-spacing: -.02em
    }

    strong {
      font-weight: 700
    }

    .container {
      width: min(1200px, calc(100% - 44px));
      margin: auto
    }

    .demo-ribbon {
      height: 31px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: #422d37;
      color: #fff0ee;
      text-align: center;
      font-size: .72rem;
      letter-spacing: .035em
    }

    .demo-dot {
      height: 7px;
      width: 7px;
      display: inline-block;
      background: #eaa4ac;
      border-radius: 50%
    }

    .site-header {
      background: rgba(255, 250, 246, .94);
      border-bottom: 1px solid #f1e4e3;
      position: sticky;
      top: 0;
      z-index: 20;
      backdrop-filter: blur(14px)
    }

    .header-content {
      height: 85px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px
    }

    .brand {
      border: 0;
      background: transparent;
      display: flex;
      align-items: center;
      gap: 10px;
      text-align: left;
      color: var(--ink);
      padding: 0;
      min-width: 215px
    }

    .brand-seal {
      display: grid;
      place-items: center;
      background: var(--primary);
      color: white;
      width: 46px;
      height: 46px;
      border-radius: 16px;
      font-size: 28px;
      font-family: Georgia;
      transform: rotate(-10deg)
    }

    .brand-words strong {
      display: block;
      font: 700 24px Georgia;
      letter-spacing: -1px;
      line-height: 1.1
    }

    .brand-words strong i {
      color: var(--primary);
      font-weight: 400
    }

    .brand-words small {
      letter-spacing: .21em;
      font-size: 8px;
      color: var(--gold);
      font-weight: 750
    }

    .main-nav {
      display: flex;
      gap: 8px
    }

    .nav-link,
    .admin-link {
      background: none;
      border: 0;
      color: #64545b;
      padding: 11px 15px;
      border-radius: 999px;
      font-weight: 600;
      font-size: .9rem
    }

    .nav-link:hover,
    .nav-link.active,
    .admin-link:hover {
      background: var(--rose);
      color: var(--primary-dark)
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 12px
    }

    .admin-link {
      white-space: nowrap
    }

    .btn {
      border-radius: 12px;
      border: 1px solid transparent;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      padding: 13px 20px;
      font-weight: 700;
      line-height: 1.1;
      transition: transform .15s, box-shadow .15s, background .15s;
      text-decoration: none;
      white-space: nowrap
    }

    .btn:hover:not(:disabled) {
      transform: translateY(-1px)
    }

    .btn-primary {
      background: var(--primary);
      color: white;
      box-shadow: 0 7px 16px #b85b7224
    }

    .btn-primary:hover {
      background: var(--primary-dark)
    }

    .btn-light {
      background: var(--paper);
      color: var(--ink);
      border-color: var(--border)
    }

    .btn-light:hover {
      border-color: var(--primary)
    }

    .btn-soft {
      background: var(--rose);
      color: var(--primary-dark)
    }

    .btn-dark {
      background: var(--ink);
      color: white
    }

    .btn-small {
      padding: 9px 14px;
      font-size: .84rem
    }

    .btn-wide {
      width: 100%
    }

    .app-main {
      min-height: 68vh;
      padding-top: 38px;
      padding-bottom: 80px
    }

    .eyebrow {
      color: var(--primary-dark);
      font-size: .75rem;
      font-weight: 800;
      letter-spacing: .18em;
      text-transform: uppercase
    }

    .section-heading {
      display: flex;
      justify-content: space-between;
      align-items: end;
      gap: 20px;
      margin: 45px 0 22px
    }

    .section-heading p {
      max-width: 475px;
      color: var(--muted);
      margin: 8px 0 0
    }

    .section-heading h2 {
      margin: 9px 0 0
    }

    .muted {
      color: var(--muted)
    }

    .soft-title {
      color: var(--gold);
      font-size: .83rem;
      letter-spacing: .13em;
      text-transform: uppercase;
      font-weight: 750
    }

    .hero {
      border-radius: 32px;
      overflow: hidden;
      display: grid;
      grid-template-columns: 1fr 1fr;
      min-height: 535px;
      background: linear-gradient(120deg, #fff0e6 0%, #ffe9e5 70%, #fce0e5 100%);
      position: relative
    }

    .hero-copy {
      padding: 65px 24px 60px 65px;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      justify-content: center
    }

    .hero-copy h1 {
      margin: 14px 0 24px
    }

    .hero-copy h1 em {
      font-weight: 400;
      color: var(--primary);
      font-style: italic
    }

    .hero-copy p {
      max-width: 440px;
      font-size: 1.04rem;
      color: #735b64
    }

    .hero-actions {
      display: flex;
      gap: 12px;
      margin-top: 17px;
      flex-wrap: wrap
    }

    .hero-art {
      min-height: 470px;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center
    }

    .hero-art img {
      width: 95%;
      height: auto;
      filter: drop-shadow(0 14px 21px #87445519);
      transform: rotate(2deg)
    }

    .hero-stamp {
      position: absolute;
      right: 25px;
      top: 45px;
      border: 1px solid #d7a19c;
      background: #fff9f4d9;
      color: #a15f68;
      border-radius: 50%;
      display: grid;
      place-items: center;
      text-align: center;
      width: 103px;
      height: 103px;
      font: italic 17px Georgia;
      transform: rotate(13deg);
      box-shadow: 0 7px 25px #8e656414
    }

    .hero-stamp small {
      display: block;
      font: 700 9px Inter, sans-serif;
      letter-spacing: .06em
    }

    .benefits {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
      margin: 24px 0 20px
    }

    .benefit {
      display: flex;
      align-items: center;
      gap: 15px;
      padding: 19px 20px;
      background: var(--paper);
      border: 1px solid var(--border);
      border-radius: 18px
    }

    .benefit-icon {
      height: 43px;
      width: 43px;
      background: var(--rose);
      display: grid;
      place-items: center;
      border-radius: 15px;
      font-size: 23px;
      flex-shrink: 0
    }

    .benefit strong {
      display: block;
      font-size: .94rem
    }

    .benefit small {
      color: var(--muted);
      font-size: .8rem
    }

    .product-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 21px
    }

    .product-card {
      border: 1px solid var(--border);
      border-radius: 20px;
      overflow: hidden;
      background: var(--paper);
      transition: box-shadow .2s, transform .2s
    }

    .product-card:hover {
      box-shadow: var(--shadow);
      transform: translateY(-3px)
    }

    .product-img {
      width: 100%;
      height: 233px;
      object-fit: cover;
      background: var(--peach)
    }

    .product-info {
      padding: 19px 21px 21px
    }

    .product-topline {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: center;
      margin-bottom: 8px
    }

    .category {
      color: var(--primary);
      font-size: .71rem;
      letter-spacing: .10em;
      text-transform: uppercase;
      font-weight: 800
    }

    .product-info h3 {
      font-family: Georgia;
      font-weight: 600;
      font-size: 1.4rem;
      margin-bottom: 7px
    }

    .product-info p {
      color: var(--muted);
      font-size: .85rem;
      min-height: 41px;
      margin-bottom: 15px
    }

    .product-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px
    }

    .product-price {
      font-weight: 800;
      font-size: 1.15rem
    }

    .product-price small {
      color: var(--muted);
      font-size: .7rem;
      font-weight: 500;
      display: block
    }

    .tag {
      display: inline-block;
      padding: 5px 11px;
      border-radius: 99px;
      background: var(--rose);
      color: var(--primary-dark);
      font-weight: 750;
      font-size: .73rem
    }

    .tag.green {
      background: var(--sage);
      color: var(--green)
    }

    .tag.gold {
      background: #f9efdb;
      color: #8b692e
    }

    .tag.gray {
      background: #f1eef0;
      color: #685c62
    }

    .link-button {
      border: 0;
      background: transparent;
      color: var(--primary-dark);
      font-weight: 700;
      padding: 5px 0
    }

    .link-button:hover {
      text-decoration: underline
    }

    .story-section {
      margin-top: 70px;
      display: grid;
      grid-template-columns: 1fr .9fr;
      background: #f8edee;
      border-radius: 28px;
      overflow: hidden;
      min-height: 275px
    }

    .story-section>div:first-child {
      padding: 45px
    }

    .story-section h2 {
      margin: 8px 0 14px
    }

    .story-section p {
      color: #705d64;
      max-width: 540px
    }

    .story-art {
      background: radial-gradient(circle at 50% 50%, #fffaf6, #f0c5ce);
      display: grid;
      place-items: center;
      min-height: 260px
    }

    .story-art img {
      height: 245px;
      width: 330px;
      object-fit: contain
    }

    .page-intro {
      margin: 10px 0 28px
    }

    .page-intro h1 {
      font-size: clamp(2.5rem, 4vw, 4rem);
      margin: 10px 0 10px
    }

    .page-intro p {
      color: var(--muted);
      max-width: 650px
    }

    .filters {
      display: flex;
      gap: 10px;
      margin-bottom: 24px;
      flex-wrap: wrap;
      align-items: center
    }

    .chip {
      background: white;
      border: 1px solid var(--border);
      color: #6b575d;
      padding: 10px 18px;
      border-radius: 999px;
      font-weight: 700
    }

    .chip.selected {
      background: var(--ink);
      color: white;
      border-color: var(--ink)
    }

    .input-search {
      margin-left: auto;
      min-width: 260px
    }

    .field,
    .input-search {
      border: 1px solid #e5d8da;
      border-radius: 12px;
      background: #fff;
      outline: none;
      padding: 13px 15px;
      min-width: 0;
      width: 100%;
      color: var(--ink);
      transition: border .15s, box-shadow .15s
    }

    .field:focus,
    .input-search:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px #b85b7220
    }

    .field[readonly] {
      background: #f7f4f2
    }

    .form-label {
      display: block;
      font-weight: 700;
      font-size: .82rem;
      margin-bottom: 7px
    }

    .field-hint {
      font-size: .75rem;
      color: var(--muted);
      margin: 6px 0 0
    }

    .form-group {
      min-width: 0
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 18px
    }

    .form-grid .span-2 {
      grid-column: span 2
    }

    .builder-layout {
      display: grid;
      grid-template-columns: 1fr 350px;
      gap: 27px;
      align-items: start
    }

    .panel {
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 20px;
      box-shadow: 0 7px 32px #7947560a
    }

    .panel-body {
      padding: 29px
    }

    .panel-title {
      font-size: 1.45rem;
      font-family: Georgia;
      margin: 0 0 6px
    }

    .panel-sub {
      color: var(--muted);
      font-size: .88rem;
      margin: 0 0 25px
    }

    .stepper {
      display: flex;
      align-items: center;
      gap: 9px;
      margin-bottom: 20px;
      flex-wrap: wrap
    }

    .step {
      display: flex;
      gap: 8px;
      align-items: center;
      color: #968991;
      font-weight: 750;
      font-size: .77rem
    }

    .step-index {
      display: grid;
      place-items: center;
      width: 29px;
      height: 29px;
      border-radius: 50%;
      background: #f0e9e9
    }

    .step.active {
      color: var(--primary-dark)
    }

    .step.active .step-index {
      background: var(--primary);
      color: white
    }

    .step.done .step-index {
      background: var(--sage);
      color: var(--green)
    }

    .step-line {
      width: 27px;
      height: 1px;
      background: #e5d8da
    }

    .select-cakes {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 13px
    }

    .select-cake {
      border: 2px solid var(--border);
      border-radius: 15px;
      text-align: left;
      background: #fff;
      padding: 8px;
      min-width: 0
    }

    .select-cake.active {
      border-color: var(--primary);
      background: #fff6f7;
      box-shadow: 0 0 0 2px #b85b7214
    }

    .select-cake img {
      border-radius: 10px;
      width: 100%;
      aspect-ratio: 1.28;
      object-fit: cover
    }

    .select-cake strong {
      display: block;
      font-size: .8rem;
      margin: 8px 3px 0;
      line-height: 1.3
    }

    .select-cake small {
      display: block;
      margin: 3px;
      color: var(--muted)
    }

    .radio-cards {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px
    }

    .radio-card {
      border: 1.5px solid var(--border);
      border-radius: 12px;
      padding: 12px;
      background: #fff;
      text-align: left
    }

    .radio-card.selected {
      border-color: var(--primary);
      background: var(--rose)
    }

    .radio-card strong {
      display: block;
      font-size: .84rem
    }

    .radio-card small {
      display: block;
      color: var(--muted);
      font-size: .76rem
    }

    .field-stack {
      margin-top: 20px
    }

    .field-stack>*+* {
      margin-top: 18px
    }

    .button-row {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      margin-top: 29px;
      padding-top: 24px;
      border-top: 1px solid var(--border)
    }

    .summary {
      position: sticky;
      top: 136px;
      overflow: hidden
    }

    .summary-image {
      height: 190px;
      width: 100%;
      object-fit: cover
    }

    .summary-body {
      padding: 23px
    }

    .summary-body h3 {
      font-family: Georgia;
      font-size: 1.55rem;
      margin-bottom: 5px
    }

    .summary-list {
      margin: 20px 0;
      display: grid;
      gap: 11px
    }

    .summary-row {
      display: flex;
      justify-content: space-between;
      gap: 20px;
      font-size: .84rem
    }

    .summary-row span:first-child {
      color: var(--muted)
    }

    .summary-row strong {
      text-align: right;
      max-width: 190px;
      overflow-wrap: anywhere
    }

    .summary-total {
      border-top: 1px dashed #ddc8ca;
      padding-top: 18px;
      display: flex;
      align-items: center;
      justify-content: space-between
    }

    .summary-total strong {
      font-size: 1.65rem
    }

    .info-box {
      padding: 14px 15px;
      border-radius: 12px;
      background: #fcf2e9;
      font-size: .82rem;
      color: #8a653f;
      margin-top: 17px
    }

    .notice {
      padding: 14px 18px;
      background: var(--rose);
      border: 1px solid #eed2d7;
      color: #774c5c;
      border-radius: 13px;
      margin: 18px 0
    }

    .notice.green {
      background: var(--sage);
      border-color: #d5e2d2;
      color: var(--green)
    }

    .notice strong {
      display: block
    }

    .track-layout {
      display: grid;
      grid-template-columns: 390px 1fr;
      gap: 25px
    }

    .order-search {
      padding: 28px
    }

    .order-search h3 {
      font-size: 1.45rem;
      font-family: Georgia
    }

    .order-result {
      min-height: 300px
    }

    .empty-state {
      padding: 60px 25px;
      text-align: center;
      border: 1px dashed #e4cfd3;
      border-radius: 18px;
      background: #fff
    }

    .empty-state-icon {
      font-size: 42px
    }

    .empty-state p {
      color: var(--muted);
      max-width: 370px;
      margin: 10px auto 0
    }

    .order-head {
      display: flex;
      align-items: start;
      justify-content: space-between;
      gap: 15px;
      margin-bottom: 18px
    }

    .order-head h3 {
      font-size: 1.65rem;
      font-family: Georgia;
      margin: 0
    }

    .order-detail {
      padding: 28px
    }

    .order-meta {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 16px;
      background: #fcf7f5;
      border-radius: 13px;
      padding: 18px;
      margin: 20px 0
    }

    .meta-item small {
      display: block;
      color: var(--muted);
      font-size: .73rem
    }

    .meta-item strong {
      display: block;
      font-size: .91rem;
      margin-top: 3px
    }

    .progress-line {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 4px;
      margin: 24px 0;
      position: relative
    }

    .progress-line:before {
      content: "";
      position: absolute;
      left: 23px;
      right: 23px;
      top: 16px;
      height: 2px;
      background: #eadcdd
    }

    .progress-point {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      width: 22%;
      gap: 8px;
      font-size: .71rem;
      color: #95838b
    }

    .progress-dot {
      width: 33px;
      height: 33px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: #f3edee;
      border: 2px solid #fff;
      color: #8e7e83;
      font-size: 12px;
      font-weight: 800
    }

    .progress-point.done .progress-dot {
      background: var(--green);
      color: white
    }

    .progress-point.active .progress-dot {
      background: var(--primary);
      color: white;
      box-shadow: 0 0 0 3px #b85b7220
    }

    .progress-point.done,
    .progress-point.active {
      color: var(--ink);
      font-weight: 700
    }

    .quote-box {
      border: 1px solid #e6d2d6;
      border-radius: 16px;
      padding: 20px;
      background: #fff8f8;
      margin-top: 20px
    }

    .quote-box-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px
    }

    .quote-price {
      font: 500 2rem Georgia;
      color: var(--primary-dark)
    }

    .quote-box p {
      font-size: .85rem;
      color: var(--muted)
    }

    .admin-shell {
      display: grid;
      grid-template-columns: 230px 1fr;
      gap: 22px;
      align-items: start
    }

    .admin-sidebar {
      background: #3d2a32;
      color: #fff;
      border-radius: 19px;
      padding: 20px 13px;
      position: sticky;
      top: 136px
    }

    .admin-sidebar .sidebar-heading {
      font: 500 1.5rem Georgia;
      padding: 8px 14px 18px;
      border-bottom: 1px solid #ffffff30;
      margin-bottom: 13px
    }

    .side-link {
      width: 100%;
      border: 0;
      color: #eedfe2;
      background: transparent;
      text-align: left;
      border-radius: 11px;
      padding: 12px 14px;
      display: flex;
      gap: 10px;
      align-items: center;
      font-weight: 700;
      font-size: .9rem;
      margin-bottom: 4px
    }

    .side-link:hover,
    .side-link.active {
      background: #ffffff1c;
      color: #fff
    }

    .side-divider {
      border: 0;
      border-top: 1px solid #ffffff25;
      margin: 17px 10px
    }

    .admin-main {
      min-width: 0
    }

    .admin-title-row {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      align-items: center;
      margin: 0 0 23px
    }

    .admin-title-row h1 {
      font-size: 2.6rem;
      margin: 0 0 5px
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 15px;
      margin-bottom: 23px
    }

    .stat {
      background: #fff;
      border: 1px solid var(--border);
      padding: 21px;
      border-radius: 17px
    }

    .stat small {
      color: var(--muted);
      font-weight: 650
    }

    .stat strong {
      display: block;
      font-size: 2rem;
      line-height: 1.4
    }

    .stat span {
      font-size: .78rem;
      color: var(--primary-dark)
    }

    .admin-panel {
      padding: 24px
    }

    .admin-panel h3 {
      font-family: Georgia;
      font-size: 1.5rem;
      margin: 0 0 5px
    }

    .table-wrap {
      overflow-x: auto;
      margin-top: 15px
    }

    .data-table {
      border-collapse: collapse;
      width: 100%;
      text-align: left;
      font-size: .83rem
    }

    .data-table th {
      color: var(--muted);
      font-size: .71rem;
      letter-spacing: .06em;
      text-transform: uppercase;
      background: #fcf6f6
    }

    .data-table th,
    .data-table td {
      padding: 15px 12px;
      border-bottom: 1px solid #f1e6e7;
      vertical-align: middle
    }

    .data-table tbody tr:last-child td {
      border-bottom: 0
    }

    .data-table td strong {
      display: block
    }

    .data-table td small {
      color: var(--muted);
      display: block
    }

    .table-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 6px
    }

    .table-actions .btn {
      white-space: normal
    }

    .admin-catalog-list {
      display: grid;
      gap: 11px;
      margin-top: 21px
    }

    .admin-product-row {
      display: grid;
      grid-template-columns: 70px 1fr auto auto;
      gap: 14px;
      align-items: center;
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 11px
    }

    .admin-product-row img {
      width: 70px;
      height: 61px;
      object-fit: cover;
      border-radius: 10px
    }

    .admin-product-row strong {
      display: block
    }

    .admin-product-row small {
      color: var(--muted)
    }

    .calendar-demo {
      display: flex;
      gap: 10px;
      align-items: end;
      flex-wrap: wrap;
      margin: 20px 0
    }

    .calendar-demo .form-group {
      flex: 1;
      min-width: 200px
    }

    .blocked-list {
      display: flex;
      gap: 10px;
      flex-wrap: wrap
    }

    .blocked-pill {
      background: #fce8eb;
      color: #894f61;
      border-radius: 999px;
      padding: 8px 11px;
      font-size: .8rem;
      font-weight: 700
    }

    .blocked-pill button {
      background: none;
      color: inherit;
      border: 0;
      margin-left: 9px
    }

    .login-wrap {
      max-width: 485px;
      margin: 45px auto
    }

    .login-panel {
      padding: 38px
    }

    .login-panel .login-icon {
      font-size: 35px;
      margin-bottom: 15px
    }

    .login-panel h1 {
      font-size: 2.8rem;
      margin-bottom: 13px
    }

    .login-panel p {
      color: var(--muted)
    }

    .login-panel form {
      margin-top: 27px
    }

    .login-panel .form-group {
      margin-bottom: 17px
    }

    .toggle-switch {
      width: 49px;
      height: 27px;
      border: 0;
      border-radius: 20px;
      background: #e7dadd;
      position: relative;
      padding: 0
    }

    .toggle-switch:before {
      content: "";
      position: absolute;
      top: 4px;
      left: 4px;
      width: 19px;
      height: 19px;
      border-radius: 50%;
      background: white;
      transition: left .2s
    }

    .toggle-switch.on {
      background: #75a17e
    }

    .toggle-switch.on:before {
      left: 26px
    }

    .toast {
      position: fixed;
      bottom: 22px;
      right: 22px;
      z-index: 110;
      opacity: 0;
      transform: translateY(12px);
      transition: all .2s;
      background: var(--ink);
      color: #fff;
      border-radius: 13px;
      padding: 13px 19px;
      box-shadow: var(--shadow);
      max-width: 350px;
      pointer-events: none
    }

    .toast.show {
      opacity: 1;
      transform: none
    }

    .site-modal {
      border: 0;
      border-radius: 23px;
      padding: 0;
      width: min(550px, calc(100vw - 34px));
      box-shadow: 0 30px 120px #291b2380;
      color: var(--ink)
    }

    .site-modal::backdrop {
      background: #2f1e287e;
      backdrop-filter: blur(3px)
    }

    .modal-head {
      padding: 24px 28px 15px;
      display: flex;
      align-items: start;
      justify-content: space-between;
      gap: 10px
    }

    .modal-head h2 {
      font-size: 1.9rem;
      margin: 0
    }

    .modal-body {
      padding: 0 28px 28px
    }

    .icon-button {
      border: 0;
      background: #f7edf0;
      border-radius: 50%;
      width: 35px;
      height: 35px;
      display: grid;
      place-items: center;
      font-size: 19px
    }

    .site-footer {
      background: #402c34;
      color: #f9eeee
    }

    .footer-grid {
      padding-top: 41px;
      padding-bottom: 34px;
      display: grid;
      grid-template-columns: 2fr 1fr 1fr;
      gap: 35px
    }

    .footer-logo {
      font: 500 27px Georgia
    }

    .footer-grid p {
      color: #d6bbc3;
      font-size: .86rem;
      max-width: 270px;
      margin: 10px 0
    }

    .footer-grid strong {
      display: block;
      margin-bottom: 13px
    }

    .footer-grid button {
      border: 0;
      background: transparent;
      display: block;
      color: #e8cfd7;
      margin-bottom: 10px;
      padding: 0;
      text-align: left
    }

    .footer-grid button:hover {
      text-decoration: underline
    }

    .footer-bottom {
      border-top: 1px solid #ffffff23;
      padding: 18px 0;
      font-size: .72rem;
      color: #d8bac4;
      display: flex;
      justify-content: space-between
    }

    .detail-flex {
      display: grid;
      grid-template-columns: 185px 1fr;
      gap: 20px
    }

    .detail-flex img {
      border-radius: 14px;
      object-fit: cover;
      height: 200px;
      width: 100%
    }

    .hidden {
      display: none !important
    }

    @media(max-width:1050px) {
      .header-content {
        gap: 9px
      }

      .brand {
        min-width: 190px
      }

      .brand-words strong {
        font-size: 21px
      }

      .admin-link span {
        display: none
      }

      .hero-copy {
        padding-left: 42px
      }

      .builder-layout {
        grid-template-columns: 1fr 300px

      function catalog() {
        const prods = data.products.filter(p => p.active && (catFilter === 'Todos' || p.category === catFilter) && (`${p.name} ${p.description}`).toLowerCase().includes(catSearch.toLowerCase()));
        return `${pageIntro('NUESTRO CATÁLOGO', 'Pasteles para cada ocasión', 'Todos se preparan por encargo. Los precios son orientativos; recibirás la cotización final antes de confirmar.')}
      <div class="filters">${['Todos', 'Clásicos', 'Frutales', 'Especiales'].map(c => `<button type="button" data-action="filterCategory" data-category="${c}" class="chip ${c === catFilter ? 'selected' : ''}">${c}</button>`).join('')}<input id="catalogSearch" aria-label="Buscar pasteles" placeholder="⌕ Buscar pastel..." class="input-search" value="${escapeHtml(catSearch)}"></div>
      ${prods.length ? `<div class="product-grid">${prods.map(productCard).join('')}</div>` : `<div class="empty-state"><span class="empty-state-icon">⌕</span><h3>No encontramos pasteles</h3><p>Prueba otro término o selecciona otra categoría.</p></div>`}`;
      }
      function stepper() { return `<div class="stepper">${[['1', 'Pastel'], ['2', 'Detalles'], ['3', 'Entrega']].map(([i, label], j) => `${j ? '<div class="step-line"></div>' : ''}<div class="step ${step === j + 1 ? 'active' : step > j + 1 ? 'done' : ''}"><span class="step-index">${step > j + 1 ? '✓' : i}</span>${label}</div>`).join('')}</div>` }
      const selectField = (label, key, values) => `<div class="form-group"><label class="form-label" for="draft_${key}">${label}</label><select id="draft_${key}" class="field" data-draft="${key}">${values.map(v => `<option value="${escapeHtml(v)}" ${selected(draft[key], v)}>${escapeHtml(v)}</option>`).join('')}</select></div>`;
      const inputField = (label, key, type = 'text', placeholder = '', extra = '') => `<div class="form-group"><label class="form-label" for="draft_${key}">${label}</label><input id="draft_${key}" type="${type}" class="field" data-draft="${key}" placeholder="${escapeHtml(placeholder)}" value="${escapeHtml(draft[key])}" ${extra}></div>`;
      function orderBuilder() {
        let fields = '';
        if (step === 1) { fields = `<div class="select-cakes">${data.products.filter(p => p.active).map(p => `<button type="button" class="select-cake ${p.id === draft.productId ? 'active' : ''}" data-action="selectCake" data-id="${p.id}"><img src="${p.image}" alt=""><strong>${escapeHtml(p.name)}</strong><small>Desde ${money(p.base)}</small></button>`).join('')}</div><div class="field-stack"><div class="form-group"><label class="form-label">Tamaño del pastel</label><div class="radio-cards">${options.size.map(([name, desc]) => `<button type="button" data-action="setSize" data-value="${name}" class="radio-card ${draft.size === name ? 'selected' : ''}"><strong>${name}</strong><small>${desc}</small></button>`).join('')}</div></div></div>` }
        if (step === 2) { fields = `<div class="form-grid">${selectField('Sabor del pan', 'flavor', options.flavor)}${selectField('Relleno', 'filling', options.filling)}${selectField('Decoración', 'decor', options.decor)}${inputField('Mensaje sobre el pastel', 'message', 'text', 'Ej. Feliz cumpleaños Ana')}<div class="span-2 form-group"><label for="draft_notes" class="form-label">Indicaciones adicionales (opcional)</label><textarea id="draft_notes" data-draft="notes" class="field" rows="4" placeholder="Colores, temática, restricciones, detalles...">${escapeHtml(draft.notes)}</textarea></div></div><div class="info-box">La decoración temática puede aumentar el precio estimado. El importe final se confirma mediante cotización.</div>` }
        if (step === 3) { fields = `<div class="form-grid">${inputField('Nombre y apellido *', 'name', 'text', 'Nombre de quien recoge', 'required autocomplete="name"')}${inputField('WhatsApp de contacto *', 'phone', 'tel', '10 dígitos', 'required maxlength="10" inputmode="numeric"')}${inputField('Fecha de recolección *', 'date', 'date', '', `min="${isoDate(2)}" required`)}<div class="form-group"><label class="form-label">Modalidad de entrega</label><input class="field" value="Recolección en la pastelería" readonly><p class="field-hint">Lugar y horario se acuerdan con la propietaria.</p></div></div><div class="notice">La solicitud <strong>no es una compra confirmada.</strong> Primero se revisará la disponibilidad y se enviará una cotización.${data.blockedDates.length ? `<br><br><b>Fechas no disponibles:</b> ${data.blockedDates.sort().map(fmtDate).join(', ')}` : ''}</div>` }
        const p = product(draft.productId);
        return `${pageIntro('HAZLO TUYO', 'Personaliza tu pastel', 'Cuéntanos cómo imaginas tu pastel. Solo necesitas tres pasos para solicitar una cotización.')}
      <div class="builder-layout"><section class="panel"><div class="panel-body">${stepper()}<h2 class="panel-title">${['Elige tu pastel', 'Agrega los detalles', '¿Cuándo lo necesitas?'][step - 1]}</h2><p class="panel-sub">${['Comencemos por tu favorito y su tamaño.', 'Personaliza sabor, relleno y decoración.', 'Comparte tus datos para registrar tu solicitud.'][step - 1]}</p>${fields}<div class="button-row">${step > 1 ? btn('← Regresar', 'prevStep', 'btn btn-light') : btn('← Ver catálogo', 'goCatalog', 'btn btn-light')}${btn(step === 3 ? 'Enviar solicitud →' : 'Continuar →', step === 3 ? 'submitOrder' : 'nextStep')}</div></div></section>
      <aside class="panel summary"><img class="summary-image" src="${p.image}" alt="${escapeHtml(p.name)}"><div class="summary-body"><span class="eyebrow">TU SELECCIÓN</span><h3>${escapeHtml(p.name)}</h3><div class="summary-list"><div class="summary-row"><span>Tamaño</span><strong>${escapeHtml(draft.size)}</strong></div><div class="summary-row"><span>Sabor / relleno</span><strong>${escapeHtml(draft.flavor)} / ${escapeHtml(draft.filling)}</strong></div><div class="summary-row"><span>Decoración</span><strong>${escapeHtml(draft.decor)}</strong></div>${draft.date ? `<div class="summary-row"><span>Fecha</span><strong>${fmtDate(draft.date)}</strong></div>` : ''}</div><div class="summary-total"><span>Estimado desde</span><strong>${money(estimate())}</strong></div><div class="info-box">Monto ilustrativo sujeto a cotización. No se realiza ningún cobro.</div></div></aside></div>`;
      }
      function tracking() {
        const order = data.orders.find(o => o.id.toLowerCase() === trackId.trim().toLowerCase());
        return `${pageIntro('SEGUIMIENTO', 'Consulta tu pedido', 'Escribe tu folio para revisar el estado de tu pastel y responder a la cotización.')}
      <div class="track-layout"><aside class="panel order-search"><h3>¿Ya hiciste un pedido?</h3><p class="muted">Ingresa el folio recibido al enviar tu solicitud.</p><form id="trackForm"><label class="form-label" for="trackInput">Folio de pedido</label><input id="trackInput" class="field" value="${escapeHtml(trackId)}" placeholder="PA-1001" required><button type="submit" class="btn btn-primary btn-wide" style="margin-top:12px">Buscar mi pedido →</button></form><div class="info-box"><strong>Prueba de demostración:</strong> utiliza <b>PA-1001</b> para ver una cotización pendiente o <b>PA-1002</b> para ver un pedido en preparación.</div></aside>
      <div class="order-result">${order ? orderDetail(order) : `<div class="empty-state"><span class="empty-state-icon">📦</span><h3>Sin resultados</h3><p>No encontramos ese folio. Revisa que esté escrito correctamente o utiliza uno de los ejemplos.</p></div>`}</div></div>`;
      }
      function orderDetail(o) {
        const p = product(o.productId), current = stageIndex(o), status = o.status;
        return `<section class="panel order-detail"><div class="order-head"><div><span class="eyebrow">DETALLE DE PEDIDO</span><h3>${escapeHtml(o.id)}</h3><p class="muted">Solicitud de ${escapeHtml(o.name)}</p></div>${statusLabel(status)}</div><div class="order-meta"><div class="meta-item"><small>Pastel</small><strong>${escapeHtml(p.name)}</strong></div><div class="meta-item"><small>Fecha solicitada</small><strong>${fmtDate(o.date)}</strong></div><div class="meta-item"><small>Tamaño</small><strong>${escapeHtml(o.size)}</strong></div><div class="meta-item"><small>Sabor / relleno</small><strong>${escapeHtml(o.flavor)} / ${escapeHtml(o.filling)}</strong></div></div>
      <h3>Seguimiento</h3><div class="progress-line">${['Solicitud', 'Confirmado', 'Preparación', 'Listo', 'Entregado'].map((s, i) => `<div class="progress-point ${i < current ? 'done' : i === current ? 'active' : ''}"><span class="progress-dot">${i < current ? '✓' : i + 1}</span><span>${s}</span></div>`).join('')}</div>
      ${o.quote !== null && o.quote !== undefined ? `<div class="quote-box"><div class="quote-box-head"><strong>Cotización de tu pastel</strong><span class="tag ${o.quoteAccepted ? 'green' : 'gold'}">${o.quoteAccepted ? 'Aceptada' : 'Pendiente de aceptación'}</span></div><div class="quote-price">${money(o.quote)}</div><p>Esta cotización es una simulación y no genera un cargo.</p>${!o.quoteAccepted ? btn('Aceptar cotización ✓', 'acceptQuote', 'btn btn-primary', `data-id="${o.id}"`) : `<div class="notice green"><strong>¡Cotización aceptada!</strong> Tu pedido está confirmado en el prototipo.</div>`}</div>` : `<div class="notice"><strong>Cotización pendiente.</strong> La propietaria revisará los detalles antes de confirmar un precio.</div>`}
      </section>`;
      }
      function adminLogin() {
        return `<div class="login-wrap"><section class="panel login-panel"><span class="eyebrow">ACCESO DE DEMOSTRACIÓN</span><div class="login-icon">✿</div><h1>Panel de pastelería</h1><p>Accede al espacio de la administradora para revisar solicitudes, generar cotizaciones y dar seguimiento a los pedidos.</p><form id="loginForm"><div class="form-group"><label class="form-label" for="loginEmail">Correo electrónico</label><input type="email" id="loginEmail" class="field" value="admin@migamiel.demo" required></div><div class="form-group"><label class="form-label" for="loginPassword">Contraseña</label><input type="password" id="loginPassword" class="field" value="demo123" required></div><button class="btn btn-primary btn-wide" type="submit">Entrar al panel →</button></form><div class="info-box"><strong>Contraseña y usuario</strong><br>Correo: admin@migamiel.demo<br>Contraseña: demo123<br></div></section></div>`;
      }
      const adminNames = { resumen: 'Resumen del negocio', catalogo: 'Administrar catálogo', solicitudes: 'Solicitudes de pedido', cotizaciones: 'Elaborar cotizaciones', calendario: 'Fechas de recolección', pedidos: 'Control de pedidos' };
      function adminView() {
        return `<section class="admin-shell"><aside class="admin-sidebar"><div class="sidebar-heading">✿ Panel de gestión</div>${[['resumen', '▦', 'Resumen'], ['catalogo', '◫', 'Catálogo'], ['solicitudes', '▤', 'Solicitudes'], ['cotizaciones', '＄', 'Cotizaciones'], ['calendario', '▦', 'Calendario'], ['pedidos', '▣', 'Pedidos']].map(([id, icon, title]) => `<button type="button" class="side-link ${adminTab === id ? 'active' : ''}" data-action="adminTab" data-tab="${id}"><span>${icon}</span>${title}</button>`).join('')}<hr class="side-divider"><button class="side-link" type="button" data-action="adminLogout">↪ Salir</button></aside>
      <div class="admin-main"><div class="admin-title-row"><div><span class="eyebrow">ADMINISTRACIÓN · MODO DEMO</span><h1>${adminNames[adminTab]}</h1></div>${btn('Vista cliente ↗', 'goHome', 'btn btn-light btn-small')}</div>${adminContent()}</div></section>`;
      }
      function adminContent() {
        const pending = data.orders.filter(o => !o.quoteAccepted), newReq = data.orders.filter(o => o.status === 'Solicitud recibida'), active = data.orders.filter(o => o.quoteAccepted && o.status !== 'Entregado');
        if (adminTab === 'resumen') return `<div class="stats"><div class="stat"><small>Solicitudes recibidas</small><strong>${data.orders.length}</strong><span>Total registradas</span></div><div class="stat"><small>Por cotizar</small><strong>${newReq.length}</strong><span>Requieren respuesta</span></div><div class="stat"><small>Pedidos en curso</small><strong>${active.length}</strong><span>Confirmados activos</span></div></div><section class="panel admin-panel"><h3>Pedidos recientes</h3><p class="muted">Información de demostración guardada en este navegador.</p>${ordersTable(data.orders.slice().reverse(), true)}</section><div class="notice">Prueba el flujo completo: crea un pedido como cliente, regresa al panel, envía una cotización y acéptala desde “Mi pedido”.</div>`;
        if (adminTab === 'catalogo') return `<section class="panel admin-panel"><h3>Productos disponibles</h3><p class="muted">Activa o desactiva pasteles. También puedes modificar el precio base ilustrativo.</p><div class="admin-catalog-list">${data.products.map(p => `<div class="admin-product-row"><img src="${p.image}" alt=""><div><strong>${escapeHtml(p.name)}</strong><small>${money(p.base)} · ${escapeHtml(p.category)}</small></div><button type="button" aria-label="${p.active ? 'Ocultar' : 'Mostrar'} ${escapeHtml(p.name)}" aria-pressed="${p.active}" class="toggle-switch ${p.active ? 'on' : ''}" data-action="toggleProduct" data-id="${p.id}"></button>${btn('Editar precio', 'editPrice', 'btn btn-light btn-small', `data-id="${p.id}"`)}</div>`).join('')}</div></section>`;
        if (adminTab === 'solicitudes') return `<section class="panel admin-panel"><h3>Solicitudes recibidas</h3><p class="muted">Revisa los pedidos de los clientes y prepara sus cotizaciones.</p>${ordersTable(data.orders.filter(o => o.status === 'Solicitud recibida' || o.status === 'Cotización enviada'), true)}</section>`;
        if (adminTab === 'cotizaciones') return `<section class="panel admin-panel"><h3>Cotizaciones</h3><p class="muted">Define el precio final y envíalo a la pantalla del cliente.</p>${ordersTable(data.orders.filter(o => !o.quoteAccepted), true)}</section>`;
        if (adminTab === 'calendario') return `<section class="panel admin-panel"><h3>Fechas no disponibles</h3><p class="muted">Marca fechas en las que no se recibirán nuevos pedidos. Se reflejarán en el formulario del cliente.</p><form id="blockedDateForm" class="calendar-demo"><div class="form-group"><label class="form-label" for="blockedDate">Seleccionar fecha</label><input id="blockedDate" type="date" class="field" min="${isoDate(2)}" required></div><button class="btn btn-primary" type="submit">Bloquear fecha</button></form><h3>Fechas bloqueadas</h3><div class="blocked-list">${data.blockedDates.length ? data.blockedDates.sort().map(d => `<span class="blocked-pill">${fmtDate(d)} <button data-action="removeBlocked" data-date="${d}" aria-label="Desbloquear ${fmtDate(d)}">×</button></span>`).join('') : '<p class="muted">No hay fechas bloqueadas.</p>'}</div></section>`;
        return `<section class="panel admin-panel"><h3>Administración de pedidos</h3><p class="muted">Cuando se acepte una cotización, podrás actualizar el estado hasta su entrega.</p>${ordersTable(data.orders, true)}</section>`;
      }
      function ordersTable(orders, actions = false) {
        if (!orders.length) return '<div class="empty-state" style="margin-top:20px"><h3>No hay registros en esta sección</h3><p>Los pedidos aparecerán aquí cuando se generen.</p></div>';
        return `<div class="table-wrap"><table class="data-table"><thead><tr><th>Folio / cliente</th><th>Producto</th><th>Recolección</th><th>Estado</th>${actions ? '<th>Acciones</th>' : ''}</tr></thead><tbody>${orders.map(o => `<tr><td><strong>${escapeHtml(o.id)}</strong><small>${escapeHtml(o.name)}</small></td><td>${escapeHtml(product(o.productId).name)}</td><td>${fmtDate(o.date)}</td><td>${statusLabel(o.status)}</td>${actions ? `<td><div class="table-actions">${o.status === 'Solicitud recibida' || o.status === 'Cotización enviada' ? btn(o.quote == null ? 'Cotizar' : 'Editar cotización', 'editQuote', 'btn btn-soft btn-small', `data-id="${o.id}"`) : ''}${o.quoteAccepted && o.status !== 'Entregado' ? btn('Siguiente etapa →', 'advanceOrder', 'btn btn-light btn-small', `data-id="${o.id}"`) : ''}${btn('Ver detalle', 'viewOrder', 'btn btn-light btn-small', `data-id="${o.id}"`)}</div></td>` : ''}</tr>`).join('')}</tbody></table></div>`;
      }
      function openModal(title, content) { dialog.innerHTML = `<div class="modal-head"><h2 id="modal-title">${title}</h2><button class="icon-button" type="button" data-action="closeModal" aria-label="Cerrar ventana">×</button></div><div class="modal-body">${content}</div>`; dialog.showModal() }
      const closeModal = () => { if (dialog.open) dialog.close() };
      function quoteModal(id) {
        const o = data.orders.find(o => o.id === id); if (!o) return;
        openModal('Preparar cotización', `<p class="muted">Pedido <b>${o.id}</b> de <b>${escapeHtml(o.name)}</b>.</p><div class="order-meta"><div class="meta-item"><small>Pastel</small><strong>${escapeHtml(product(o.productId).name)}</strong></div><div class="meta-item"><small>Tamaño</small><strong>${escapeHtml(o.size)}</strong></div><div class="meta-item"><small>Decoración</small><strong>${escapeHtml(o.decor)}</strong></div><div class="meta-item"><small>Estimado</small><strong>${money(o.estimate)}</strong></div></div><p class="muted">Mensaje: ${escapeHtml(o.message) || 'Sin mensaje'}<br>Notas: ${escapeHtml(o.notes) || 'Sin notas'}</p><form id="quoteForm" data-id="${o.id}"><div class="form-group"><label for="quoteAmount" class="form-label">Precio final de cotización (MXN)</label><input type="number" id="quoteAmount" min="1" max="1000000" step="1" class="field" value="${o.quote ?? o.estimate}" required></div><div class="button-row">${btn('Cancelar', 'closeModal', 'btn btn-light')}<button class="btn btn-primary" type="submit">Enviar cotización →</button></div></form>`);
      }
      function detailModal(id) { const o = data.orders.find(o => o.id === id); if (!o) return; openModal(`Pedido ${escapeHtml(o.id)}`, `<p><b>Cliente:</b> ${escapeHtml(o.name)}<br><b>WhatsApp:</b> ${escapeHtml(o.phone)}<br><b>Fecha:</b> ${fmtDate(o.date)}</p><div class="detail-flex"><img src="${product(o.productId).image}" alt=""><div><b>${escapeHtml(product(o.productId).name)}</b><p>Tamaño: ${escapeHtml(o.size)}<br>Sabor: ${escapeHtml(o.flavor)}<br>Relleno: ${escapeHtml(o.filling)}<br>Decoración: ${escapeHtml(o.decor)}<br>Mensaje: ${escapeHtml(o.message || 'Sin mensaje')}<br>Notas: ${escapeHtml(o.notes || 'Sin notas')}</p><b>Estado:</b> ${statusLabel(o.status)}<br><b>Cotización:</b> ${o.quote == null ? 'Pendiente' : money(o.quote)}</div></div>`) }
      function productDetails(id) { const p = product(id); openModal(escapeHtml(p.name), `<div class="detail-flex"><img src="${p.image}" alt="Ilustración del pastel ${escapeHtml(p.name)}"><div><span class="category">${escapeHtml(p.category)}</span><p>${escapeHtml(p.description)}</p><p><b>Desde ${money(p.base)}</b><br><small class="muted">Precio base para pastel chico, sujeto a cotización.</small></p><p class="muted">Disponible en tamaños chico, mediano y grande, con distintas opciones de sabor, relleno y decoración.</p></div></div><div class="button-row">${btn('Cerrar', 'closeModal', 'btn btn-light')}${btn('Personalizar este pastel ↗', 'choose', 'btn btn-primary', `data-id="${p.id}"`)}</div>`) }
      function priceModal(id) { const p = product(id); openModal('Editar precio base', `<form id="priceForm" data-id="${p.id}"><p class="muted">${escapeHtml(p.name)}. Cambia el precio ilustrativo mostrado a los clientes.</p><label class="form-label" for="basePrice">Precio base (MXN)</label><input type="number" class="field" id="basePrice" min="1" max="1000000" step="1" value="${p.base}" required><div class="button-row">${btn('Cancelar', 'closeModal', 'btn btn-light')}<button type="submit" class="btn btn-primary">Guardar cambios</button></div></form>`) }
      function submitOrder() {
        if (step !== 3) { step++; render(); return }
        if (!draft.name.trim() || !/^\d{10}$/.test(draft.phone.replace(/\s/g, '')) || !draft.date) { notify('Ingresa nombre, WhatsApp de 10 dígitos y fecha.'); return }
        if (draft.date < isoDate(2)) { notify('Selecciona una fecha con al menos dos días de anticipación.'); return }
        if (data.blockedDates.includes(draft.date)) { notify('Esa fecha no está disponible. Selecciona otra.'); return }
        const id = `PA-${data.nextId++}`;
        data.orders.push({ ...draft, id, name: draft.name.trim(), phone: draft.phone, estimate: estimate(), quote: null, quoteAccepted: false, status: 'Solicitud recibida', created: isoDate() }); save(); draft = draftDefault(); step = 1; trackId = id; navigate('seguimiento'); notify(`Solicitud ${id} registrada correctamente.`);
      }
      document.addEventListener('click', event => {
        const nav = event.target.closest('[data-route]'); if (nav) { event.preventDefault(); navigate(nav.dataset.route); return }
        const t = event.target.closest('[data-action]'); if (!t) return; event.preventDefault(); const a = t.dataset.action, id = t.dataset.id;
        switch (a) {
          case 'goHome': navigate('inicio'); break;
          case 'goCatalog': navigate('catalogo'); break;
          case 'goOrder': step = 1; draft = draftDefault(); navigate('pedido'); break;
          case 'choose': closeModal(); draft = draftDefault(); draft.productId = Number(id); step = 1; navigate('pedido'); break;
          case 'productDetails': productDetails(id); break;
          case 'filterCategory': catFilter = t.dataset.category; render(); break;
          case 'selectCake': draft.productId = Number(id); render(); break;
          case 'setSize': draft.size = t.dataset.value; render(); break;
          case 'prevStep': step = Math.max(1, step - 1); render(); break;
          case 'nextStep': step = Math.min(3, step + 1); render(); break;
          case 'submitOrder': submitOrder(); break;
          case 'acceptQuote': {
            const o = data.orders.find(o => o.id === id); if (o && o.quote != null && !o.quoteAccepted) { o.quoteAccepted = true; o.status = 'Confirmado'; save(); render(); notify('Cotización aceptada. Pedido confirmado en el prototipo.') } break;
          }
          case 'adminTab': adminTab = t.dataset.tab; render(); break;
          case 'adminLogout': sessionStorage.removeItem('miga_miel_admin'); render(); notify('Saliste del panel de administración.'); break;
          case 'toggleProduct': { const p = product(id); p.active = !p.active; save(); render(); notify(p.active ? 'Producto disponible en catálogo.' : 'Producto oculto del catálogo.'); break }
          case 'editPrice': priceModal(id); break;
          case 'editQuote': quoteModal(id); break;
          case 'advanceOrder': {
            const o = data.orders.find(o => o.id === id); if (o && o.quoteAccepted) { const i = stageIndex(o); if (i < stageList.length - 1) { o.status = stageList[i + 1]; save(); render(); notify(`${id}: estado actualizado a ${o.status}`) } } break;
          }
          case 'viewOrder': detailModal(id); break;
          case 'removeBlocked': data.blockedDates = data.blockedDates.filter(d => d !== t.dataset.date); save(); render(); notify('Fecha nuevamente disponible.'); break;
          case 'closeModal': closeModal(); break;
          case 'resetDemo': if (window.confirm('¿Reiniciar todos los datos de ejemplo?')) { data = newDemo(); save(); render(); notify('Datos de demostración restaurados.') } break;
        }
      });
      document.addEventListener('input', event => {
        const t = event.target;
        if (t.id === 'catalogSearch') {
          const caret = t.selectionStart; catSearch = t.value;
          // Actualiza resultados sin perder el foco del campo de búsqueda.
          const html = catalog(); app.innerHTML = html; const field = document.getElementById('catalogSearch'); field.focus(); field.setSelectionRange(caret, caret);
        }
        if (t.dataset.draft) { draft[t.dataset.draft] = t.value; if (t.dataset.draft !== 'notes') { const box = document.querySelector('.summary'); if (box) { const s = document.createElement('div'); s.innerHTML = orderBuilder(); const newSummary = s.querySelector('.summary'); if (newSummary) box.replaceWith(newSummary) } } }
      });
      document.addEventListener('submit', event => {
        const f = event.target;
        if (!['trackForm', 'loginForm', 'quoteForm', 'priceForm', 'blockedDateForm'].includes(f.id)) return;
        event.preventDefault();
        if (f.id === 'trackForm') { trackId = document.getElementById('trackInput').value.trim().toUpperCase(); render(); return }
        if (f.id === 'loginForm') {
          const ok = document.getElementById('loginEmail').value.trim().toLowerCase() === 'admin@migamiel.demo' && document.getElementById('loginPassword').value === 'demo123';
          if (!ok) { notify('Credenciales de demostración incorrectas.'); return }
          sessionStorage.setItem('miga_miel_admin', 'yes'); adminTab = 'resumen'; render(); notify('Bienvenida al panel de demostración.'); return;
        }
        if (f.id === 'quoteForm') {
          const amount = Number(document.getElementById('quoteAmount').value), o = data.orders.find(o => o.id === f.dataset.id);
          if (!o || !Number.isInteger(amount) || amount < 1 || amount > 1000000) return;
          o.quote = amount; o.quoteAccepted = false; o.status = 'Cotización enviada'; save(); closeModal(); render(); notify(`Cotización de ${money(amount)} enviada a ${o.id}.`); return;
        }
        if (f.id === 'priceForm') {
          const price = Number(document.getElementById('basePrice').value), p = product(f.dataset.id);
          if (!Number.isInteger(price) || price < 1 || price > 1000000) return;
          p.base = price; save(); closeModal(); render(); notify('Precio base actualizado.'); return;
        }
        if (f.id === 'blockedDateForm') {
          const d = document.getElementById('blockedDate').value;
          if (!d || d < isoDate(2)) { notify('Selecciona una fecha futura válida.'); return }
          if (!data.blockedDates.includes(d)) data.blockedDates.push(d); save(); render(); notify('Fecha bloqueada para nuevas solicitudes.'); return;
        }
      });
      dialog.addEventListener('click', e => { if (e.target === dialog) closeModal() });
      save(); render();
    })();

  </script>
</body>

</html>
